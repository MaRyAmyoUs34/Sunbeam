<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Perfect Day ~ Interactive Scrapbook</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f5;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #5c4033;
            --accent: #ffb6c1;
            --shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            --diary-bg: #fffbf0;
        }

        body.dark-mode {
            --bg-color: #2c2230;
            --card-bg: rgba(45, 35, 48, 0.85);
            --text-color: #f3e8ff;
            --accent: #d8b4fe;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --diary-bg: #3b2d40;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px dashed var(--accent);
            border-radius: 25px;
            padding: 40px;
            box-shadow: var(--shadow);
            position: relative;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin-bottom: 5px;
            color: var(--accent);
        }

        p.subtitle {
            font-size: 1.1rem;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        /* Music Player Box */
        .music-player {
            background: var(--bg-color);
            border: 1px solid var(--accent);
            border-radius: 15px;
            padding: 12px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .disc {
            font-size: 1.5rem;
            animation: spin 3s linear infinite;
            animation-play-state: paused;
        }

        .disc.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Scrapbook Grid */
        .moments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .moment-card {
            background: var(--bg-color);
            border: 2px solid var(--accent);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .moment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .moment-card span {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
        }

        .display-box {
            background: var(--bg-color);
            border-radius: 15px;
            padding: 25px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-style: italic;
            border: 1px solid var(--accent);
            margin-bottom: 25px;
        }

        /* Interactive Diary Concept */
        .diary-section {
            background: var(--diary-bg);
            border: 1px solid var(--accent);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }

        .diary-section h4 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .diary-input {
            width: 100%;
            height: 80px;
            background: transparent;
            border: none;
            border-bottom: 1px dashed var(--accent);
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            line-height: 1.8rem;
            color: var(--text-color);
            resize: none;
            outline: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            background: var(--accent);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button:active {
            transform: scale(0.95);
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            font-size: 1.2rem;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-70px) scale(1.6) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>A Perfect Day ✨</h1>
        <p class="subtitle">Click each scene to curate a nostalgic, beautiful escape.</p>
        
        <!-- Music Widget -->
        <div class="music-player">
            <div class="music-info">
                <span class="disc" id="music-disc">🎵</span>
                <div>
                    <strong>Lo-Fi Background Symphony</strong><br>
                    <small style="opacity: 0.7;">Calm Daydream Beats</small>
                </div>
            </div>
            <!-- Standard dynamic audio streaming element -->
            <audio id="bg-audio" loop src="https://soundhelix.com"></audio>
            <button onclick="toggleMusic()" id="play-btn" style="padding: 6px 15px; font-size: 0.85rem;">Play Melody 🎧</button>
        </div>

        <!-- Scrapbook Grid -->
        <div class="moments-grid">
            <div class="moment-card" onclick="showMemory('morning')">
                <span>☕</span>
                <h3>Morning</h3>
            </div>
            <div class="moment-card" onclick="showMemory('afternoon')">
                <span>🌸</span>
                <h3>Afternoon</h3>
            </div>
            <div class="moment-card" onclick="showMemory('evening')">
                <span>🌅</span>
                <h3>Golden Hour</h3>
            </div>
            <div class="moment-card" onclick="showMemory('night')">
                <span>⭐</span>
                <h3>Night</h3>
            </div>
        </div>

        <!-- Dynamic Display Box -->
        <div class="display-box" id="memory-display">
            "Tap any card to uncover the beautiful textures of an idealized day."
        </div>

        <!-- Interactive Diary Box for Judges -->
        <div class="diary-section">
            <h4>✍️ Write Your Own Perfect Day:</h4>
            <textarea class="diary-input" placeholder="Type a memory here... (Watch it blend beautifully into the scrapbook format!)"></textarea>
        </div>

        <!-- Footer Systems -->
        <div class="controls">
            <button onclick="toggleNightMode()">Switch Aesthetic Vibe 🌙</button>
            <button onclick="addSparkleButton(event)">Burst Sparkles 💖</button>
        </div>
    </div>

    <script>
        const memories = {
            morning: "Warm cinnamon lattes, golden sunlight painting patterns on the floor tiles, and a soft breeze rustling through the lace curtains.",
            afternoon: "A sudden velvet shadow across your desk, fresh wild strawberry macaroons, and finishing a hidden chapter of a leather-bound book.",
            evening: "Dreamy peach-pink skies stretching outward, walking down quiet streets listening to an old comfort song on loop.",
            night: "Huddled underneath standard cozy duvet blankets, watching distant city lights dance while feeling entirely at ease."
        };

        function showMemory(time) {
            const display = document.getElementById('memory-display');
            display.style.opacity = 0;
            setTimeout(() => {
                display.innerText = `"${memories[time]}"`;
                display.style.opacity = 1;
            }, 200);
        }

        function toggleNightMode() {
            document.body.classList.toggle('dark-mode');
        }

        function toggleMusic() {
            const audio = document.getElementById('bg-audio');
            const button = document.getElementById('play-btn');
            const disc = document.getElementById('music-disc');
            
            if (audio.paused) {
                audio.play();
                button.innerText = "Pause Melody ⏸️";
                disc.classList.add('playing');
            } else {
                audio.pause();
                button.innerText = "Play Melody 🎧";
disc.classList.remove('playing');}}function addSparkleButton(e) {for (let i = 0; i < 6; i++) {createSparkle(e.clientX + (Math.random() * 50 - 25), e.clientY + (Math.random() * 50 - 25));}}window.addEventListener('click', (e) => {if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'TEXTAREA' && !e.target.closest('.moment-card')) {createSparkle(e.clientX, e.clientY);}});function createSparkle(x, y) {const sparkle = document.createElement('div');sparkle.className = 'sparkle';sparkle.innerText = ['✨', '💖', '🌸', '🎀', '🧁'][Math.floor(Math.random() * 5)];sparkle.style.left = ${x}px;sparkle.style.top = ${y}px;document.body.appendChild(sparkle);setTimeout(() => sparkle.remove(), 1000);}
